# Anime4K preset manifest, read by scripts/anime4k-presets.sh.
#
# A preset is a name followed by one upstream shader path per indented line.
# Paths are relative to the bloc97/Anime4K repo at ANIME4K_COMMIT in stack.conf,
# and their order is the order the passes appear in the combined file.
#
# After adding or moving a shader, run: scripts/anime4k-presets.sh --update-lock
low:
    glsl/Restore/Anime4K_Clamp_Highlights.glsl
    glsl/Upscale+Denoise/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl
    glsl/Restore/Anime4K_Restore_CNN_M.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl

medium:
    glsl/Restore/Anime4K_Clamp_Highlights.glsl
    glsl/Restore/Anime4K_Restore_CNN_Soft_VL.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_VL.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl
    glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl

high:
    glsl/Restore/Anime4K_Clamp_Highlights.glsl
    glsl/Restore/Anime4K_Restore_CNN_VL.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_VL.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl

ultra:
    glsl/Restore/Anime4K_Clamp_Highlights.glsl
    glsl/Restore/Anime4K_Restore_CNN_VL.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_VL.glsl
    glsl/Restore/Anime4K_Restore_CNN_M.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x2.glsl
    glsl/Upscale/Anime4K_AutoDownscalePre_x4.glsl
    glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl
