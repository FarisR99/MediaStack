# MediaStack shared configuration. Sourced by bash scripts (scripts/common/lib.sh)
# and passed to the Linux Docker build as build args. KEY=value only, no logic.

# Projects in build order.
STACK_PROJECTS="nv-codec-headers libplacebo ffmpeg mpv nvenc"

# Upstream remotes ('upstream' in each submodule; nv-codec-headers has no fork).
UPSTREAM_ffmpeg=https://github.com/FFmpeg/FFmpeg.git
UPSTREAM_libplacebo=https://github.com/haasn/libplacebo.git
UPSTREAM_mpv=https://github.com/mpv-player/mpv.git
UPSTREAM_nvenc=https://github.com/rigaya/NVEnc.git
UPSTREAM_nv_codec_headers=

# Upstream branch merged into our custom branch by scripts/merge-upstream.sh.
UPSTREAM_BRANCH=master

# Linux (Docker) build
UBUNTU_VERSION=22.04
CUDA_VERSION=13.4.3
MESON_VERSION=1.12.1
# LunarG Vulkan SDK supplies headers, loader, shaderc and glslang newer than Ubuntu 22.04 ships.
VULKAN_SDK_VERSION=1.4.363.0
LINUX_PREFIX=/opt/mediastack

# Windows (MSYS2 UCRT64)
WINDOWS_MSYSTEM=UCRT64

# libdovi (Dolby Vision RPU parsing) for libplacebo and NVEncC; same tag NVEnc's build_libdovi.sh uses.
LIBDOVI_TAG=libdovi-3.3.2
# Prebuilt cargo-c (cargo cinstall) for building libdovi / NVEnc's libhdr10plus.
CARGO_C_VERSION=v0.10.26
# libvmaf (FFmpeg's libvmaf filter) built from source on both targets, with its models built in.
VMAF_VERSION=v3.2.1
# dav1d built from source on Linux: Ubuntu 22.04 has 0.9.2, FFmpeg needs >= 1.0.
DAV1D_VERSION=1.5.4
# SVT-AV1 (libsvtav1) built from source on Linux: Ubuntu 22.04 has 0.9.0. Windows uses MSYS2's.
SVTAV1_VERSION=v4.2.0
# Anime4K GLSL presets (scripts/anime4k-presets.sh): tag for attribution, commit for fetching.
ANIME4K_VERSION=v4.0.1
ANIME4K_COMMIT=4029bf701ecaa15f163cdc49cffe5501c1acf410
# NVEncC on Windows: AviSynth+/VapourSynth/OpenCL/Vship headers, the bundle NVEnc's release CI uses.
NVENC_HEADERS_URL=https://github.com/rigaya/ffmpeg_dlls_for_hwenc/releases/download/20250830/hwenc_headers_20260411.7z
# NVEncC on Windows: ONNX Runtime headers (--vpp-onnx loads onnxruntime.dll at runtime).
NVENC_ONNXRUNTIME_URL=https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-win-x64-1.23.2.zip
# NVIDIA runtime DLLs bundled into the Windows package (scripts/windows/package.sh),
# the bundles NVEnc's release CI ships: RTX Video SDK (TrueHDR/VSR for NVEncC,
# FFmpeg truehdr_cuda and mpv vf=gpu truehdr, plus the nvvfx filters) and Optical
# Flow FRUC (NVEncC --vpp-fruc, FFmpeg fruc_cuda), and Vship's CUDA build (NVEncC --vship-* metrics).
# Empty skips one.
NVIDIA_NGX_URL=https://github.com/rigaya/NVEnc/releases/download/9.35/NVEncNVSDKNGX_20260925_x64.7z
NVIDIA_FRUC_URL=https://github.com/rigaya/NVEnc/releases/download/7.42/NVEncNVOFFRUC_20240303_x64.7z
NVIDIA_VSHIP_URL=https://github.com/rigaya/ffmpeg_dlls_for_hwenc/releases/download/20250830/libvship_nvidia_5_0.7z
# NVEncC's optional ONNX filters (--vpp-onnx, --vpp-onnx-deint): not fetched by
# default (about 2 GB of DLLs, up to about 4 GB of models). scripts/windows/
# fetch-onnx.sh downloads them on request. The model release publishes
# SHA256SUMS.txt; the DLL bundle has no published checksum (pin one here to check it).
NVENC_ONNX_RUNTIME_URL=https://github.com/rigaya/HWEnc-onnx-models/releases/download/20260627/nvenc_vpp_onnx_dlls_20260627.7z
NVENC_ONNX_RUNTIME_SHA256=
NVENC_ONNX_MODELS_RELEASE=https://github.com/rigaya/HWEnc-onnx-models/releases/download/20260808
NVENC_ONNX_MODELS_VERSION=20260808
# NVEncC CUDA kernels: empty builds all architectures (~340 MB of kernels, runs
# on any supported GPU); a compute capability like 120 (RTX 50xx) builds only that.
NVENC_CUDA_CC=
